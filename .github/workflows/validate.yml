name: Validate CIE Multi-Institute
on:
  push:
    branches: [work/multi-institute-tenant]
  pull_request:
    branches: [work/multi-institute-tenant]
jobs:
  node-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --check server.js
      - run: node --check public/app.js
