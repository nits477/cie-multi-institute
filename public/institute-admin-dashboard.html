<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Institute Dashboard</title><style>body{margin:0;padding:28px;background:#f2f6fc;font-family:Segoe UI,Arial;color:#172b49}.wrap{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-top:24px}.card{background:#fff;border:1px solid #dce6f1;border-radius:14px;padding:22px;box-shadow:0 6px 20px #12365b0a}.num{font-size:32px;font-weight:800;color:#1265c7}.muted{color:#65758b;font-size:13px}button{padding:10px 15px;border:1px solid #d8a9a9;background:#fff;color:#a12b2b;border-radius:8px;cursor:pointer}</style></head><body><main class="wrap"><div class="top"><div><h1 id="title">Institute Dashboard</h1><div class="muted" id="code"></div></div><button id="logout">Sign Out</button></div><section class="grid"><div class="card"><div class="muted">Students</div><div class="num" id="students">—</div></div><div class="card"><div class="muted">Exams</div><div class="num" id="exams">—</div></div><div class="card"><div class="muted">Results</div><div class="num" id="results">—</div></div></section><p class="muted">These totals include only records belonging to your institute. More institute management features will be enabled after security testing.</p><div id="msg" class="muted"></div></main><script>
(async()=>{try{const r=await fetch('/api/institute-admin/dashboard');const j=await r.json();if(!r.ok)throw Error(j.error||'Session expired');$('title').textContent=j.instituteName||'Institute Dashboard';$('code').textContent='Institute Code: '+j.instituteCode;$('students').textContent=j.students;$('exams').textContent=j.exams;$('results').textContent=j.results}catch(e){$('msg').textContent=e.message;setTimeout(()=>location.href='/institute-admin/login',1200)}})();function $(id){return document.getElementById(id)}$('logout').onclick=async()=>{await fetch('/api/admin/auth/logout',{method:'POST'});location.href='/institute-admin/login'};
</script></body></html>
