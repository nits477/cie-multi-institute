<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CIE Institute Admin Login</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#edf4ff,#f8fbff);font-family:Segoe UI,Arial;color:#172b49}.card{width:min(100%,430px);background:white;border-radius:18px;overflow:hidden;box-shadow:0 18px 50px #12365b22}.head{padding:26px;background:linear-gradient(135deg,#082653,#1265c7);color:white}.head h1{margin:0;font-size:24px}.head p{margin:7px 0 0;color:#dbeaff}.body{padding:25px}label{display:block;font-weight:700;font-size:13px;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #cbd8e7;border-radius:9px;font-size:15px}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:9px;background:#1265c7;color:white;font-size:15px;font-weight:700;cursor:pointer}.msg{font-size:13px;margin-top:14px;color:#b42318}.small{font-size:12px;color:#65758b;line-height:1.5}</style></head><body><main class="card"><header class="head"><h1>Institute Admin</h1><p>CIE Multi-Institute Examination System</p></header><section class="body"><form id="f"><label>Institute Code</label><input id="code" required maxlength="20" placeholder="Institute Code"><label>Admin ID</label><input id="admin" required placeholder="Admin ID"><label>Password</label><input id="pass" type="password" required placeholder="Password"><button id="btn">Sign In</button></form><div id="msg" class="msg" role="status"></div><p class="small">Login details are provided by CIE Master Admin. Contact your administrator if your account is inactive.</p></section></main><script>
const $=id=>document.getElementById(id);$('f').onsubmit=async e=>{e.preventDefault();$('btn').disabled=true;$('msg').textContent='';try{const r=await fetch('/api/institute-admin/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({instituteCode:$('code').value,adminId:$('admin').value,password:$('pass').value})});const j=await r.json();if(!r.ok)throw Error(j.error||'Login failed');location.href='/institute-admin/dashboard'}catch(x){$('msg').textContent=x.message}finally{$('btn').disabled=false}};</script></body></html>
