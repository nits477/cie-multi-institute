<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Institute Registration — CIE</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#edf4ff,#f8fbff);font:14px Segoe UI,Arial;color:#172b49}.card{width:min(100%,680px);background:white;border-radius:16px;padding:24px;box-shadow:0 15px 45px #12365b1c}h1{margin:0;color:#082653}p{color:#65758b}form{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-weight:700;font-size:12px}input,textarea{display:block;width:100%;padding:11px;margin-top:5px;border:1px solid #cbd8e7;border-radius:8px;font:inherit}textarea{min-height:80px}button{grid-column:1/-1;padding:13px;border:0;border-radius:8px;background:#1265c7;color:white;font-weight:800;cursor:pointer}.msg{margin-top:14px;padding:10px;background:#edf5ff;border-radius:8px}@media(max-width:560px){form{grid-template-columns:1fr}}</style></head><body><main class="card"><h1>Institute Registration</h1><p>Submit your institute details. CIE Master Admin will review the application. After approval, you will receive an Institute Code and Admin ID.</p><form id="f"><label>Institute Name<input name="instituteName" required minlength="2"></label><label>Applicant Name<input name="applicantName" required minlength="2"></label><label>Email<input name="email" type="email" required></label><label>Mobile Number<input name="phone" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required></label><label>State<input name="state"></label><label>District<input name="district"></label><label style="grid-column:1/-1">Address<input name="address"></label><label style="grid-column:1/-1">Message<textarea name="message"></textarea></label><label style="grid-column:1/-1">Create Password (minimum 8 characters)<input name="password" type="password" minlength="8" required></label><button type="submit">Submit Application</button></form><div id="msg" class="msg" role="status"></div></main><script>const $=id=>document.getElementById(id);$('f').onsubmit=async e=>{e.preventDefault();const b=$('f').querySelector('button');b.disabled=true;try{const r=await fetch('/api/institute-admin/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))}),j=await r.json();if(!r.ok)throw Error(j.error||'Could not submit');$('msg').textContent='Application submitted. Your application ID is '+j.application.id+'. Please wait for CIE approval.';e.target.reset()}catch(x){$('msg').textContent=x.message}finally{b.disabled=false}};</script></body></html>
