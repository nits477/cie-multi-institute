<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CIE Master Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f6fc;color:#172b49;font:14px Segoe UI,Arial}header{background:linear-gradient(120deg,#071b3c,#1265c7);color:white;padding:22px max(18px,calc((100vw - 1100px)/2))}main{max-width:1100px;margin:22px auto;padding:0 16px}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button,button{border:0;border-radius:8px;padding:10px 14px;background:#1265c7;color:white;font-weight:700;cursor:pointer}.tabs button{background:#e3edf9;color:#234}.tabs .on{background:#082653;color:#fff}.card{background:white;border:1px solid #dce6f1;border-radius:12px;padding:16px;margin:12px 0;overflow:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #e5edf6;vertical-align:top}.muted{color:#65758b}.danger{background:#b42318}.good{background:#16803c}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.msg{background:#eaf3ff;padding:10px;border-radius:8px;margin:10px 0}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{font-size:12px;padding:7px 9px}</style></head><body><header><h1>CIE Master Admin</h1><p>Institute approvals, institutes and Institute Admin accounts</p></header><main><div class="row"><button id="refresh">Refresh Data</button><a href="/admin" style="color:#1265c7">Back to CIE Admin</a></div><div id="msg" class="msg">Loading…</div><nav class="tabs"><button class="on" data-tab="applications">Applications</button><button data-tab="institutes">Institutes</button></nav><section id="applications" class="card"><h2>Institute Applications</h2><table><thead><tr><th>Institute / Applicant</th><th>Contact</th><th>Address</th><th>Status</th><th>Action</th></tr></thead><tbody id="apps"></tbody></table></section><section id="institutes" class="card" style="display:none"><h2>Institutes</h2><table><thead><tr><th>Institute</th><th>Code</th><th>Students</th><th>Status</th><th>Action</th></tr></thead><tbody id="inst"></tbody></table></section></main><script>const $=id=>document.getElementById(id);let apps=[],institutes=[];async function api(u,o={}){const r=await fetch(u,o),j=await r.json().catch(()=>({error:'Bad response'}));if(!r.ok)throw Error(j.error||'Request failed');return j}function msg(t){$('msg').textContent=t}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{[apps,institutes]=await Promise.all([api('/api/master/applications'),api('/api/master/institutes')]);$('apps').innerHTML=apps.map(a=>'<tr><td><b>'+esc(a.instituteName)+'</b><br>'+esc(a.applicantName)+'<br><small>'+esc(a.message)+'</small></td><td>'+esc(a.email)+'<br>'+esc(a.phone)+'</td><td>'+esc(a.address)+'<br>'+esc(a.district)+' '+esc(a.state)+'</td><td>'+esc(a.status)+'</td><td>'+(a.status==='pending'?'<div class="actions"><button class="good" onclick="review('+a.id+',\'approve\')">Approve</button><button class="danger" onclick="review('+a.id+',\'reject\')">Reject</button></div>':'—')+'</td></tr>').join('')||'<tr><td colspan="5">No applications.</td></tr>';$('inst').innerHTML=institutes.map(i=>'<tr><td><b>'+esc(i.instituteName)+'</b><br>'+esc(i.email||'')+'<br>'+esc(i.phone||'')+'</td><td>'+esc(i.instituteCode)+'</td><td>'+i.students_count+'</td><td>'+esc(i.status)+'</td><td><div class="actions"><button class="'+(i.status==='active'?'danger':'good')+'" onclick="status('+i.id+',\''+(i.status==='active'?'blocked':'active')+'\')">'+(i.status==='active'?'Block':'Activate')+'</button><button class="secondary" onclick="admins('+i.id+')">Admins</button></div></td></tr>').join('')||'<tr><td colspan="5">No institutes.</td></tr>';msg('Master Admin data loaded.')}catch(e){msg(e.message);if(/permission|login/i.test(e.message))setTimeout(()=>location.href='/admin',1000)}}window.review=async(id,decision)=>{const reviewNote=prompt('Review note (optional)','');if(reviewNote===null)return;try{const x=await api('/api/master/applications/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision,reviewNote})});if(x.admin)alert('Approved! Institute Code: '+x.institute.instituteCode+'\nAdmin ID: '+x.admin.adminId+'\nApplicant uses the password they selected. Save these details securely.');await load()}catch(e){msg(e.message)}};window.status=async(id,status)=>{try{await api('/api/master/institutes/'+id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});await load()}catch(e){msg(e.message)}};window.admins=async id=>{try{const a=await api('/api/master/institutes/'+id+'/admins');alert(a.map(x=>x.adminId+' — '+x.fullName+' — '+(x.isActive?'Active':'Blocked')).join('\n')||'No admins')}catch(e){msg(e.message)}};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));$('applications').style.display=b.dataset.tab==='applications'?'block':'none';$('institutes').style.display=b.dataset.tab==='institutes'?'block':'none'});$('refresh').onclick=load;load();</script></body></html>
