services:
  - type: web
    name: cie-school-erp-demo
    runtime: node
    plan: free
    region: oregon
    branch: work/school-erp-platform-clean
    rootDir: school-erp
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BOOTSTRAP_SECRET
        sync: false
